name: 'whyline_denver_dbt'
version: '1.0'
profile: 'whyline_denver'
model-paths: ['models']
target-path: 'target'
clean-targets: ['target']
models:
  whyline_denver_dbt:
    +materialized: view
    # Table and column descriptions from the schema files also show in BigQuery.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: "{{ env_var('BQ_DATASET_STG', 'stg_denver') }}"
    core:
      +schema: "{{ env_var('BQ_DATASET_CORE', 'core_denver') }}"
      +materialized: table
    marts:
      +schema: "{{ env_var('BQ_DATASET_MART', 'mart_denver') }}"
      +tags: ["marts"]
vars:
  # On time (RTD): less than one minute early and no more than five minutes late.
  on_time_early_sec: 60
  on_time_late_sec: 300
  # First service date the poller saw whole; earlier reliability partitions keep the legacy method.
  stream_first_full_date: "2026-10-29"
  headway_tol_ratio: 0.5
  sched_match_tol_sec: 1800
  weather_station: "USW00003017"
  weather_lookback_days: 30
