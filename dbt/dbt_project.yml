name: 'whyline_denver_dbt'
version: '1.0'
profile: 'whyline_denver'
model-paths: ['models']
target-path: 'target'
clean-targets: ['target']
models:
  whyline_denver_dbt:
    +materialized: view
    staging:
      +schema: "{{ env_var('BQ_DATASET_STG', 'stg_denver') }}"
    intermediate:
      +schema: "{{ env_var('BQ_DATASET_STG', 'stg_denver') }}"
    dimensions:
      +schema: "{{ env_var('BQ_DATASET_STG', 'stg_denver') }}"
      +materialized: table
      +tags: ["dimensions"]
    facts:
      +schema: "{{ env_var('BQ_DATASET_STG', 'stg_denver') }}"
      +tags: ["facts"]
    aggregates:
      +schema: "{{ env_var('BQ_DATASET_MART', 'mart_denver') }}"
      +tags: ["aggregates"]
    marts:
      +schema: "{{ env_var('BQ_DATASET_MART', 'mart_denver') }}"
      +tags: ["marts"]
vars:
  on_time_sec: 300
  headway_tol_ratio: 0.5
  sched_match_tol_sec: 1800
  weather_station: "USW00023062"
  weather_lookback_days: 30
  dim_date_start: "2022-01-01"
  dim_date_end_offset_days: 365
  priority_weight_equity: 0.5
  priority_weight_safety: 0.3
  priority_weight_reliability: 0.2
