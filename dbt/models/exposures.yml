version: 2

exposures:
  - name: whyline_denver_app
    type: application
    maturity: low
    url: https://www.whylinedenver.com/app
    description: |
      Next.js dashboard backed by FastAPI, querying curated marts through DuckDB or BigQuery.
      The reliability marts count observed stop visits (core.fct_stop_visit) since the
      stop-visit cutover; earlier partitions keep the legacy sampled method.
    owner:
      name: WhyLine Team
    depends_on:
      - ref('mart_reliability_by_route_day')
      - ref('mart_reliability_by_stop_hour')
      - ref('mart_crash_proximity_by_stop')
      - ref('mart_access_score_by_stop')
      - ref('mart_vulnerability_by_stop')
      - ref('mart_priority_hotspots')
      - ref('mart_weather_impacts')
      - ref('mart_gtfs_stops')
      - ref('mart_gtfs_routes')
      - ref('mart_route_shapes')
      - ref('mart_service_frequency_by_stop')
      - ref('mart_frequent_network_by_route')
      - ref('mart_service_intensity_by_tract')
      - ref('mart_prediction_accuracy_by_route_day')
      - ref('mart_crowding_by_route_hour')
      - ref('mart_crowding_by_stop')
      - ref('mart_service_delivered_by_route_day')
      - ref('mart_wait_by_stop_period')
      - ref('mart_wait_by_route_day')
      - ref('mart_segment_speed_by_hour')
      - ref('mart_trip_runtime_by_route_day')
