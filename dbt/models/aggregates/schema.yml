version: 2

models:
  - name: agg_reliability_by_route_day
    description: "Daily route reliability aggregate. Grain: (route_id, service_date_mst, precip_bin, snow_day). Weather conditions are denormalized for query convenience. JOIN dim_route ON route_id for route attributes."
    config:
      meta:
        allow_in_app: true
        layer: agg
        relationships:
          - to: dim_route
            join_on: route_id
          - to: dim_weather
            join_on: service_date_mst
    data_tests:
      - unique_combination:
          column_names: [route_id, service_date_mst, precip_bin, snow_day]
    columns:
      - name: route_id
        description: "Foreign key to dim_route. JOIN dim_route ON route_id to get route_name."
        data_tests:
          - not_null
        meta:
          fk_table: dim_route
          fk_column: route_id
      - name: service_date_mst
        description: "Service date in Mountain Time."
        data_tests:
          - not_null
      - name: precip_bin
        description: "Precipitation category (none/rain/snow) — denormalized from dim_weather."
        data_tests:
          - not_null
      - name: snow_day
        description: "True if snowfall was recorded — denormalized from dim_weather."
      - name: n_events
        description: "Total transit events on this route-day."
      - name: n_reported_events
        description: "Events with a non-NULL delay value reported by GTFS-RT."
      - name: pct_on_time
        description: "Fraction of events within the on_time_sec threshold."
      - name: mean_delay_sec
        description: "Mean delay in seconds across all events."
      - name: median_delay_sec
        description: "Median (P50) delay in seconds."
      - name: p90_delay_sec
        description: "90th-percentile delay in seconds."
      - name: build_run_at
        description: "dbt build timestamp."

  - name: agg_reliability_by_stop_hour
    description: "Stop-hour reliability aggregate. Grain: (stop_id, service_date_mst, event_hour_mst). JOIN dim_stop ON stop_id for stop attributes."
    config:
      meta:
        allow_in_app: true
        layer: agg
        relationships:
          - to: dim_stop
            join_on: stop_id
    data_tests:
      - unique_combination:
          column_names: [stop_id, service_date_mst, event_hour_mst]
    columns:
      - name: stop_id
        description: "Foreign key to dim_stop. JOIN dim_stop ON stop_id to get stop_name, lat, lon."
        data_tests:
          - not_null
        meta:
          fk_table: dim_stop
          fk_column: stop_id
      - name: service_date_mst
        description: "Service date in Mountain Time."
        data_tests:
          - not_null
      - name: event_hour_mst
        description: "Hour bucket in Mountain Time (0–23)."
        data_tests:
          - not_null
      - name: n_events
        description: "Total transit events at this stop-hour."
      - name: pct_on_time
        description: "Fraction of events within the on_time_sec threshold."
      - name: mean_delay_sec
        description: "Mean delay in seconds."
      - name: p90_delay_sec
        description: "90th-percentile delay in seconds."
      - name: route_id_mode
        description: "Most frequent route_id at this stop-hour (mode); 'unknown' if no route data."
      - name: headway_adherence_rate
        description: "Average headway_adherent rate from fct_headway_adherence."
      - name: obs_headway_sec_p50
        description: "Median observed headway in seconds."
      - name: obs_headway_sec_p90
        description: "90th-percentile observed headway in seconds."
      - name: build_run_at
        description: "dbt build timestamp."

  - name: agg_weather_impacts_by_route
    description: "Weather effect on route reliability. Grain: (route_id, precip_bin). Aggregated from agg_reliability_by_route_day. JOIN dim_route ON route_id for route attributes."
    config:
      meta:
        allow_in_app: true
        layer: agg
        relationships:
          - to: dim_route
            join_on: route_id
    data_tests:
      - unique_combination:
          column_names: [route_id, precip_bin]
    columns:
      - name: route_id
        description: "Foreign key to dim_route. JOIN dim_route ON route_id to get route_name."
        data_tests:
          - not_null
        meta:
          fk_table: dim_route
          fk_column: route_id
      - name: precip_bin
        description: "Precipitation category (none/rain/snow)."
        data_tests:
          - not_null
      - name: pct_on_time_avg
        description: "Average on-time rate for this route under this weather condition."
      - name: pct_on_time_normal
        description: "Average on-time rate for this route under no-precipitation conditions (precip_bin='none')."
      - name: delta_pct_on_time
        description: "pct_on_time_avg - pct_on_time_normal. Negative means worse performance under precipitation."
      - name: build_run_at
        description: "dbt build timestamp."
