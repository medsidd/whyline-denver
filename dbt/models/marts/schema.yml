version: 2

models:
  - name: mart_reliability_by_route_day
    description: "Daily reliability per route, service date, precipitation bin, and nullable snow flag from observed stop visits (core.fct_stop_visit); excludes unassigned routes. Partitions before the stop-visit cutover keep the legacy sampled method (data_version NULL)."
    columns:
      - name: route_id
        description: "GTFS route identifier; joins to mart_gtfs_routes.route_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('mart_gtfs_routes')
              field: route_id
      - name: service_date_mst
        description: "GTFS service date (the day the trip began, America/Denver); legacy partitions used the Denver date of the sampled poll."
        data_tests:
          - not_null
      - name: precip_bin
        description: "Daily precipitation intensity: none, light, mod, heavy, or unknown when unavailable; not a snow category."
        data_tests:
          - not_null
      - name: pct_on_time
        description: "Share of visits with a known delay that were on time (0–1): less than one minute early and no more than five minutes late (RTD definition). Unknown delays are excluded, not counted as on time. Legacy partitions used |delay| <= 300 s with unknown delays as on time."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: route_name
        description: "Route short name (long name when no short name) from the latest GTFS version."
      - name: route_long_name
        description: "Route long name from the latest GTFS version."
      - name: n_events
        description: "Stop visits with an arrival (skipped stops excluded)."
      - name: n_reported_events
        description: "Visits with a known delay (the on-time and delay denominators)."
      - name: data_version
        description: "stream_v1 (30-second vehicle reports), backfill_v1 (15-minute samples, published after calibration), mixed, or NULL for legacy sampled partitions."
      - name: n_skipped
        description: "Stops RTD marked SKIPPED on trips that ran."
      - name: n_canceled_trips
        description: "Trips of the route and date that RTD canceled (core.fct_trip_status)."
      - name: n_scheduled
        description: "Scheduled stop events of the route and date (core.fct_scheduled_stop_time), canceled trips included."
      - name: pct_observed
        description: "Share of scheduled stop events with an observed visit (0–1). Canceled and unseen trips count against it; trips not in the schedule do not count. The current day's value rises as the day goes on."
      - name: pct_shape_crossing
        description: "Share of visits timed from vehicle positions crossing the stop (including origin departures)."
      - name: pct_last_prediction
        description: "Share of visits timed from RTD's final prediction (no usable vehicle positions)."
      - name: pct_within_30s
        description: "Share of visits whose arrival window (earliest to latest) is at most 30 seconds."
      - name: median_window_sec
        description: "Median arrival window in seconds."
  - name: mart_reliability_by_stop_hour
    description: "Hourly reliability per stop (one row per stop_id, service date, arrival hour) from observed stop visits, with headways between consecutive visits by the same route and direction. Partitions before the cutover keep the legacy sampled method (data_version NULL)."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to mart_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('mart_gtfs_stops')
              field: stop_id
      - name: service_date_mst
        description: "GTFS service date (the day the trip began, America/Denver); legacy partitions used the Denver date of the sampled poll."
        data_tests:
          - not_null
      - name: event_hour_mst
        description: "Hour of arrival (0–23), Denver time; in legacy partitions, the hour of the sampled event. service_date_mst is the GTFS service date, so arrivals after midnight on late trips appear as early hours of the day the trip began."
        data_tests:
          - not_null
      - name: pct_on_time
        description: "Share of the stop-hour's visits with a known delay that were on time (0–1), RTD definition; unknown delays excluded."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: stop_name
        description: "Stop name from the latest GTFS version of this stop."
      - name: lat
        description: "Stop latitude (WGS84) from the latest GTFS version of this stop."
      - name: lon
        description: "Stop longitude (WGS84) from the latest GTFS version of this stop."
      - name: route_name_mode
        description: "Route name for route_id_mode, from the latest GTFS version."
      - name: headway_adherence_rate
        description: "Share of visits whose observed headway (since the previous visit by the same route and direction) is within 50% of their scheduled headway."
      - name: data_version
        description: "stream_v1, backfill_v1 (after calibration), mixed, or NULL for legacy sampled partitions."
      - name: n_reported_events
        description: "Visits with a known delay."
      - name: pct_within_30s
        description: "Share of visits whose arrival window is at most 30 seconds."
      - name: pct_shape_crossing
        description: "Share of visits timed from vehicle positions."
  - name: mart_crash_proximity_by_stop
    description: "Crash counts within 100 m and 250 m buffers for each stop (one row per stop)."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to mart_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('mart_gtfs_stops')
              field: stop_id
      - name: crash_100m_cnt
        description: "Reported crashes within 100 m over the inclusive window ending at the latest staged crash date."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: crash_250m_cnt
        description: "Reported crashes within 250 m over the inclusive window ending at the latest staged crash date."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: stop_name
        description: "Stop name from the latest GTFS version of this stop."
      - name: lat
        description: "Stop latitude (WGS84) from the latest GTFS version of this stop."
      - name: lon
        description: "Stop longitude (WGS84) from the latest GTFS version of this stop."
  - name: mart_access_score_by_stop
    description: "Sidewalk length and normalized access score using a 200 m buffer per stop (one row per stop)."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to mart_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('mart_gtfs_stops')
              field: stop_id
      - name: sidewalk_len_m_within_200m
        description: "Total length (meters) of sidewalks intersecting the 200 m stop buffer."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: access_score_0_100
        description: "Min–max normalized sidewalk length score for the stop (0 = least, 100 = most sidewalk coverage)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100
      - name: stop_name
        description: "Stop name from the latest GTFS version of this stop."
      - name: lat
        description: "Stop latitude (WGS84) from the latest GTFS version of this stop."
      - name: lon
        description: "Stop longitude (WGS84) from the latest GTFS version of this stop."
  - name: mart_vulnerability_by_stop
    description: "ACS indicators from tracts within 804.672 m of each stop, weighted by each matching whole tract population."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to mart_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('mart_gtfs_stops')
              field: stop_id
      - name: pct_hh_no_vehicle_w
        description: "Population-weighted share of households without a vehicle within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_transit_commute_w
        description: "Population-weighted share of workers commuting by transit within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_poverty_w
        description: "Population-weighted share of residents below poverty within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: vuln_score_0_100
        description: "Min-max normalized mean of the three weighted ACS shares (0–100); higher means more relative vulnerability."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100
      - name: stop_name
        description: "Stop name from the latest GTFS version of this stop."
      - name: lat
        description: "Stop latitude (WGS84) from the latest GTFS version of this stop."
      - name: lon
        description: "Stop longitude (WGS84) from the latest GTFS version of this stop."
  - name: mart_priority_hotspots
    description: "Composite priority ranking per stop that blends vulnerability, crash exposure, and reliability problems."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to mart_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('mart_gtfs_stops')
              field: stop_id
      - name: priority_score
        description: "Priority = 0.5*vulnerability + 0.3*crash + 0.2*unreliability; missing component scores count as zero."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: stop_name
        description: "Stop name from the latest GTFS version of this stop."
      - name: lat
        description: "Stop latitude (WGS84) from the latest GTFS version of this stop."
      - name: lon
        description: "Stop longitude (WGS84) from the latest GTFS version of this stop."
  - name: mart_weather_impacts
    description: "Equal-weight average route-day on-time shares by observed precipitation bin over the configured lookback; dry baseline and delta can be null."
    columns:
      - name: route_id
        description: "GTFS route identifier; joins to mart_gtfs_routes.route_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('mart_gtfs_routes')
              field: route_id
      - name: precip_bin
        description: "Observed precipitation intensity: none, light, mod, or heavy; unknown days are excluded."
        data_tests:
          - not_null
      - name: pct_on_time_avg
        description: "Average on-time share for the route within the precipitation bin (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: pct_on_time_normal
        description: "Average on-time share on dry days (precip_bin = 'none') for the same route (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: route_name
        description: "Route short name (long name when no short name) from the latest GTFS version."
      - name: route_long_name
        description: "Route long name from the latest GTFS version."
  - name: mart_gtfs_routes
    description: "GTFS route lookup: join on route_id to filter or label routes by name."
    columns:
      - name: route_id
        description: "GTFS route identifier (e.g. 'A', 'BOLT', '0')."
        data_tests:
          - not_null
          - unique
      - name: route_name
        description: "Short display name for the route (e.g. 'A', 'BOLT', 'Broadway')."
        data_tests:
          - not_null
      - name: route_long_name
        description: "Full route description (e.g. 'Union Station to Denver Airport Station')."
      - name: route_type
        description: "GTFS route type integer (0=light rail, 2=commuter rail, 3=bus)."

  - name: mart_gtfs_stops
    description: "GTFS stop lookup: join on stop_id to filter or label stops by name."
    columns:
      - name: stop_id
        description: "GTFS stop identifier."
        data_tests:
          - not_null
          - unique
      - name: stop_name
        description: "Human-readable stop name (e.g. 'Union Station')."
        data_tests:
          - not_null
      - name: lat
        description: "Stop latitude (WGS84)."
      - name: lon
        description: "Stop longitude (WGS84)."
