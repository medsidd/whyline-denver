version: 2

models:
  - name: mart_reliability_by_route_day
    description: "Daily reliability metrics per GTFS route with precipitation context; one row per (route_id, service date, precip_bin)."
    columns:
      - name: route_id
        description: "GTFS route identifier; joins to stg_gtfs_routes.route_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_gtfs_routes')
              field: route_id
      - name: service_date_mst
        description: "Service date in Mountain Time (America/Denver)."
        data_tests:
          - not_null
      - name: precip_bin
        description: "Precipitation bucket for the service day (e.g., none, rain, snow)."
        data_tests:
          - not_null
      - name: pct_on_time
        description: "Share of realtime events for the route/day that are within the configured on-time threshold (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
  - name: mart_reliability_by_stop_hour
    description: "Hourly reliability metrics per stop (one row per stop_id, service date, hour) including headway adherence summaries."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to stg_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_gtfs_stops')
              field: stop_id
      - name: service_date_mst
        description: "Service date in Mountain Time (America/Denver)."
        data_tests:
          - not_null
      - name: event_hour_mst
        description: "Service hour (0–23) in Mountain Time."
        data_tests:
          - not_null
      - name: pct_on_time
        description: "Share of realtime events in the stop/hour that are on time (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
  - name: mart_crash_proximity_by_stop
    description: "Crash counts within 100 m and 250 m buffers for each stop (one row per stop)."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to stg_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_gtfs_stops')
              field: stop_id
      - name: crash_100m_cnt
        description: "Number of police-reported crashes within 100 meters of the stop during the snapshot window."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: crash_250m_cnt
        description: "Number of crashes within 250 meters of the stop during the snapshot window."
        data_tests:
          - accepted_range:
              min_value: 0
  - name: mart_access_score_by_stop
    description: "Sidewalk length and normalized access score using a 200 m buffer per stop (one row per stop)."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to stg_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_gtfs_stops')
              field: stop_id
      - name: sidewalk_len_m_within_200m
        description: "Total length (meters) of sidewalks intersecting the 200 m stop buffer."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: access_score_0_100
        description: "Min–max normalized sidewalk length score for the stop (0 = least, 100 = most sidewalk coverage)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100
  - name: mart_vulnerability_by_stop
    description: "Population-weighted ACS vulnerability indicators near each stop using tracts within ~0.5 miles."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to stg_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_gtfs_stops')
              field: stop_id
      - name: pct_hh_no_vehicle_w
        description: "Population-weighted share of households without a vehicle within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_transit_commute_w
        description: "Population-weighted share of workers commuting by transit within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_poverty_w
        description: "Population-weighted share of residents below poverty within the catchment (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: vuln_score_0_100
        description: "Composite vulnerability index (0–100) averaging the weighted indicators."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100
  - name: mart_priority_hotspots
    description: "Composite priority ranking per stop that blends vulnerability, crash exposure, and reliability problems."
    columns:
      - name: stop_id
        description: "GTFS stop identifier; joins to stg_gtfs_stops.stop_id."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_gtfs_stops')
              field: stop_id
      - name: priority_score
        description: "Weighted priority score (0+), computed as 0.5*vulnerability + 0.3*crash + 0.2*reliability."
        data_tests:
          - accepted_range:
              min_value: 0
  - name: mart_weather_impacts
    description: "Average on-time performance by precipitation bin with deltas against dry days (one row per route/bin)."
    columns:
      - name: route_id
        description: "GTFS route identifier; joins to stg_gtfs_routes.route_id."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_gtfs_routes')
              field: route_id
      - name: precip_bin
        description: "Precipitation bucket (e.g., none, rain, snow)."
        data_tests:
          - not_null
      - name: pct_on_time_avg
        description: "Average on-time share for the route within the precipitation bin (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: pct_on_time_normal
        description: "Average on-time share on dry days (precip_bin = 'none') for the same route (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
  - name: mart_gtfs_routes
    description: "GTFS route lookup: join on route_id to filter or label routes by name."
    columns:
      - name: route_id
        description: "GTFS route identifier (e.g. 'A', 'BOLT', '0')."
        data_tests:
          - not_null
          - unique
      - name: route_name
        description: "Short display name for the route (e.g. 'A', 'BOLT', 'Broadway')."
        data_tests:
          - not_null
      - name: route_long_name
        description: "Full route description (e.g. 'Union Station to Denver Airport Station')."
      - name: route_type
        description: "GTFS route type integer (0=light rail, 2=commuter rail, 3=bus)."

  # ── New dimensional marts (Phase 4) ──────────────────────────────────────

  - name: mart_stop_reliability_score
    description: "Internal reliability scoring helper. Grain: stop_id. 35-day rolling unreliability index feeding mart_stop_priority. Not user-queryable."
    config:
      meta:
        allow_in_app: false
        layer: mart
    columns:
      - name: stop_id
        description: "GTFS stop identifier (PK)."
        data_tests:
          - not_null
          - unique
      - name: reliability_score_0_100
        description: "Unreliability index 0–100 (higher = worse on-time performance over 35 days)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100

  - name: mart_stop_safety
    description: "Crash exposure scores per stop. Grain: stop_id. JOIN dim_stop ON stop_id for stop attributes."
    config:
      meta:
        allow_in_app: true
        layer: mart
        relationships:
          - to: dim_stop
            join_on: stop_id
    columns:
      - name: stop_id
        description: "Foreign key to dim_stop (PK)."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_stop')
              field: stop_id
      - name: crash_100m_cnt
        description: "Crashes within 100 m in snapshot window."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: crash_250m_cnt
        description: "Crashes within 250 m in snapshot window."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: crash_score_0_100
        description: "Min–max normalized crash exposure score (0 = safest, 100 = most exposed)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100

  - name: mart_stop_access
    description: "Sidewalk access scores per stop. Grain: stop_id. JOIN dim_stop ON stop_id for stop attributes."
    config:
      meta:
        allow_in_app: true
        layer: mart
        relationships:
          - to: dim_stop
            join_on: stop_id
    columns:
      - name: stop_id
        description: "Foreign key to dim_stop (PK)."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_stop')
              field: stop_id
      - name: sidewalk_len_m_within_200m
        description: "Total sidewalk length (m) within 200 m buffer."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: access_score_0_100
        description: "Min–max normalized sidewalk coverage score (0 = least, 100 = most)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100

  - name: mart_stop_equity
    description: "Demographic vulnerability scores per stop. Grain: stop_id. JOIN dim_stop ON stop_id for stop attributes."
    config:
      meta:
        allow_in_app: true
        layer: mart
        relationships:
          - to: dim_stop
            join_on: stop_id
    columns:
      - name: stop_id
        description: "Foreign key to dim_stop (PK)."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_stop')
              field: stop_id
      - name: pct_hh_no_vehicle_w
        description: "Population-weighted share of households without a vehicle (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_transit_commute_w
        description: "Population-weighted share of workers commuting by transit (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: pct_poverty_w
        description: "Population-weighted share below poverty line (0–1)."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: vuln_score_0_100
        description: "Composite vulnerability index 0–100."
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 100

  - name: mart_stop_priority
    description: "Composite stop priority ranking. Grain: stop_id. Weights configurable via priority_weight_* dbt vars. JOIN dim_stop ON stop_id for stop attributes."
    config:
      meta:
        allow_in_app: true
        layer: mart
        relationships:
          - to: dim_stop
            join_on: stop_id
    columns:
      - name: stop_id
        description: "Foreign key to dim_stop (PK)."
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_stop')
              field: stop_id
      - name: priority_score
        description: "Weighted composite score (equity * weight_equity + safety * weight_safety + reliability * weight_reliability)."
        data_tests:
          - accepted_range:
              min_value: 0
      - name: priority_rank
        description: "Dense rank by priority_score descending (1 = highest priority)."
        data_tests:
          - not_null

  # ── Deprecated compat views (Phase 4b) ───────────────────────────────────

  - name: mart_gtfs_stops
    description: "Deprecated compat view → dim_stop. Use dim_stop directly."
    columns:
      - name: stop_id
        description: "GTFS stop identifier."
        data_tests:
          - not_null
          - unique
      - name: stop_name
        description: "Human-readable stop name (e.g. 'Union Station')."
        data_tests:
          - not_null
      - name: lat
        description: "Stop latitude (WGS84)."
      - name: lon
        description: "Stop longitude (WGS84)."
