version: 2

models:
  - name: stg_gtfs_routes
    data_tests:
      - unique_combination:
          column_names: ['_extract_date', 'route_id']
    columns:
      - name: route_id
        data_tests:
          - not_null

  - name: stg_gtfs_stops
    data_tests:
      - unique_combination:
          column_names: ['_extract_date', 'stop_id']
    columns:
      - name: stop_id
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null

  - name: stg_gtfs_trips
    columns:
      - name: trip_id
        data_tests:
          - not_null
      - name: route_id
        data_tests:
          - relationships:
              to: ref('stg_gtfs_routes')
              field: route_id

  - name: stg_gtfs_stop_times
    columns:
      - name: trip_id
        data_tests:
          - not_null
      - name: stop_id
        data_tests:
          - not_null

  - name: stg_rt_events
    columns:
      - name: feed_ts_utc
        data_tests:
          - not_null
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_gtfs_routes')
              field: route_id
      - name: trip_id
        data_tests:
          - not_null
      - name: event_ts_utc
        data_tests:
          - not_null

  - name: stg_denver_crashes
    columns:
      - name: crash_id
        data_tests:
          - not_null
          - unique
      - name: event_ts_utc
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null

  - name: stg_sidewalks
    columns:
      - name: sidewalk_id
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null
      - name: length_m
        data_tests:
          - accepted_range:
              min_value: 0
              exclusive_min: true

  - name: stg_weather
    data_tests:
      - unique_combination:
          column_names: ['date', 'station']
    columns:
      - name: date
        data_tests:
          - not_null
      - name: station
        data_tests:
          - not_null

  - name: stg_acs_geo
    data_tests:
      - unique_combination:
          column_names: ['geoid', 'year']
    columns:
      - name: geoid
        data_tests:
          - not_null
      - name: pct_hh_no_vehicle
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: pct_transit_commute
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: pct_poverty
        data_tests:
          - accepted_range:
              min_value: 0
              max_value: 1

  - name: stg_denver_tracts
    columns:
      - name: geoid
        data_tests:
          - not_null
          - unique
      - name: name
        data_tests:
          - not_null
      - name: aland_m2
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null

  - name: stg_rt_stop_visits
    description: "Stop visits from the stream poller or the backfill, typed; view over raw (partitioned by load hour, 90-day expiry)."
    columns:
      - name: arrival_method
        data_tests:
          - not_null:
              config:
                where: "_ingested_at >= timestamp_sub(current_timestamp(), interval 1 day)"

  - name: stg_rt_trip_status
    description: "Trip instances closed by the stream poller, typed; view over raw (partitioned by load hour, 90-day expiry)."

  - name: stg_rt_vehicle_positions
    description: "Distinct vehicle reports from the stream (no repeats, at most 120 s old, inside the Denver box) with the poller's along-route projection; view over raw. Filter feed_ts_utc with a constant."

  - name: stg_rt_prediction_changes
    description: "Trip-update history as changes only (new, changed, dropped, trip-level rows); view over raw. Filter feed_ts_utc with a constant."

  - name: stg_gtfs_shapes
    description: "One GEOGRAPHY line per GTFS extract x shape_id, with geodesic length and the last shape_dist_traveled. Filter _extract_date with a constant."
