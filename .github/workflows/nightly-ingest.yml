name: Nightly Ingest

on:
  schedule:
    # Off the hour: GitHub delays top-of-hour schedules most (runs at 08:00 began 6–10 h late)
    - cron: "17 8 * * *"
  workflow_dispatch:

# A manual run and a late scheduled run must not build or export at the same time; queue instead.
concurrency:
  group: nightly-ingest
  cancel-in-progress: false

# First link of the nightly chain: Nightly BigQuery starts when this finishes, and Nightly
# DuckDB when that succeeds. GitHub starts scheduled runs hours late, so separate clocks
# let the DuckDB refresh overlap the build.
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure gcloud credentials
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT" > ${{ github.workspace }}/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/gcp-key.json" >> $GITHUB_ENV

      - name: Ingest datasets and load to BigQuery
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_RAW: ${{ secrets.BQ_DATASET_RAW }}
          NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: make nightly-ingest-bq

      # Last, so a source that stopped arriving turns this run red without holding up the
      # load above or the build that follows.
      - name: Check raw sources are fresh
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/profiles
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_RAW: ${{ secrets.BQ_DATASET_RAW }}
        run: make dbt-source-freshness
